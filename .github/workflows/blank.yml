
#!/usr/bin/env bash
set -euo pipefail

if [[ $EUID -ne 0 ]]; then
    echo "Execute: sudo bash install_host.sh"
    exit 1
fi

export DEBIAN_FRONTEND=noninteractive

apt-get update
apt-get install -y \
    qemu-system-x86 \
    qemu-utils \
    ovmf \
    swtpm \
    python3 \
    python3-venv \
    curl \
    ca-certificates \
    ufw

# Instala o Tailscale pelo instalador oficial.
curl -fsSL https://tailscale.com/install.sh -o /tmp/tailscale-install.sh
bash /tmp/tailscale-install.sh
rm -f /tmp/tailscale-install.sh

# Permite VNC apenas pela interface privada Tailscale.
ufw allow in on tailscale0 to any port 5901 proto tcp
ufw deny 5901/tcp

mkdir -p /opt/virtual-gaming-pc
chmod 755 /opt/virtual-gaming-pc

echo
echo "Instalação concluída."
echo "Agora execute: sudo tailscale up"
echo "Confira a GPU e a virtualização antes de criar a VM."
_installed(self):
